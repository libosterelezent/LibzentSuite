# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# CodeRabbit review configuration — tuned for LibzentSuite (2026-11-16).
# The binding engineering standards live in AGENTS.md; these instructions
# point the reviewer at the parts that matter in a diff.

language: en-US
tone_instructions: >-
  Be direct and technical. The gates already catch lint/types (mypy
  zero floor, ruff, coverage floor, 3.10-3.13 matrix) — do not restate
  those. Focus on logic, contracts, and account isolation.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
      - feat/pivot-core
  path_filters:
    - "!dump/**"
    - "!knowledgebase/**"
    - "!**/*.md.lock"
  path_instructions:
    - path: "core/**"
      instructions: >-
        core/ owns the domain. ControlAPI (core/api.py) is the ONE
        application facade — new shared behavior extends it, never a
        parallel path. Preserve the seams: repositories are reached
        through services, never from plugins. AGENTS.md §1–§4 are
        binding (typed signatures, no blanket ignores, dataclasses for
        structured data, cancellation never swallowed).
    - path: "database/**"
      instructions: >-
        All SQL stays in repositories; values always parameter-bound.
        The canonical helpers live in repositories/base.py (row_to_dict,
        inserted_rowid, typed _tx/_fetch_*). New tables need a numbered
        migration in db.py's chain.
    - path: "adapters/**"
      instructions: >-
        Plugins never see adapter types — the boundary is the DTO layer
        (adapters/model.py) and the PluginServices protocol. Watch for
        anything leaking client/limiter/bus internals outward.
    - path: "plugins/**"
      instructions: >-
        The plugin contract (core/plugin_base.py): COG is the command
        face, EMITS/FOLLOWS the chain declarations, settings are
        Setting manifests. Sends go ONLY through ctx.services (the
        paced pipeline) — a raw client send here is a review blocker.
    - path: "tests/**"
      instructions: >-
        Tests assert externally observable contracts (AGENTS.md §7).
        Flag weakened assertions, deleted regression coverage, and
        wall-clock sleeps where a deterministic seam exists.
    - path: "docs/**"
      instructions: >-
        Docs must track the code (AGENTS.md rule 8). Flag contract
        claims that contradict the diff. docs/plans/ is historical —
        do not propose rewording history.
    - path: ".github/**"
      instructions: >-
        Workflows: actions must be pinned and recorded in
        actions.lock; workflow tokens stay read-only; new actions need
        a supply-chain justification.

knowledge_base:
  opt_out: false
  learnings:
    repository: true
  issues:
    repository: true
