name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned pip
        run: python -m pip install --upgrade "pip==26.2.2"
      - name: Install locked runtime and CI dependencies
        run: python -m pip install -r requirements-dev.lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Pyflakes (production tree)
        run: |
          python -m pyflakes main.py core adapters interfaces database benchmark scripts \
            && echo "pyflakes clean"
      - name: Unit / integration / simulation / stress tests
        run: python -m unittest discover -s tests -t . -v
