name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # the weekly health sweep reuses this whole gate

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Build (the pyproject inventory contract)
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: |
          uv build
          ls -1 dist/

  unittest:
    strategy:
      fail-fast: false
      matrix:
        # the full support floor: 3.10 (the declared minimum) through
        # the newest stable — a green 3.11 proved nothing about the rest
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install dependencies (exact lock; fails on pyproject/lock drift)
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: uv sync --locked
      - name: Ruff lint (production tree)
        run: |
          uv run --frozen ruff check main.py core adapters interfaces database benchmark scripts parsers plugins \
            && echo "ruff check clean"
      - name: Ruff format check (production tree)
        run: |
          uv run --frozen ruff format --check main.py core adapters interfaces database benchmark scripts parsers plugins \
            && echo "ruff format clean"
      - name: requirements.txt export sync (the AGENTS.md §8 contract)
        run: |
          uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Mypy strict ratchet — production tree (.github/mypy-baseline)
        run: |
          uv run --frozen mypy main.py core adapters database interfaces plugins benchmark scripts parsers \
            &> /tmp/mypy-prod.log || true
          errors=$(grep -c "error:" /tmp/mypy-prod.log || true)
          baseline=$(<.github/mypy-baseline)
          echo "mypy production errors: $errors (baseline: $baseline)"
          if [ "$errors" -gt "$baseline" ]; then
            echo "::error::The production error count grew ($baseline -> $errors). Fix the new strict errors; lower .github/mypy-baseline only after fixing existing ones."
            exit 1
          fi
          if [ "$errors" -lt "$baseline" ]; then
            echo "::error::mypy improved ($baseline -> $errors) but the baseline was not lowered in this PR — update .github/mypy-baseline to $errors (the shrink-only contract)."
            exit 1
          fi
      - name: Mypy strict ratchet — tests tree (.github/mypy-tests-baseline)
        run: |
          uv run --frozen mypy tests &> /tmp/mypy-tests.log || true
          errors=$(grep -c "error:" /tmp/mypy-tests.log || true)
          baseline=$(<.github/mypy-tests-baseline)
          echo "mypy tests errors: $errors (baseline: $baseline)"
          if [ "$errors" -gt "$baseline" ]; then
            echo "::error::The tests error count grew ($baseline -> $errors). Fix the new strict errors; lower .github/mypy-tests-baseline only after fixing existing ones."
            exit 1
          fi
          if [ "$errors" -lt "$baseline" ]; then
            echo "::error::mypy tests improved ($baseline -> $errors) but the baseline was not lowered in this PR — update .github/mypy-tests-baseline to $errors (the shrink-only contract)."
            exit 1
          fi
      - name: Unit / integration / simulation / stress tests (coverage)
        run: |
          uv run --frozen coverage run -m unittest discover -s tests -t .
          uv run --frozen coverage report
      - name: Coverage summary (job annotation)
        if: always()
        run: uv run --frozen coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
