name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install dependencies (exact lock — runtime + dev group)
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: uv sync --frozen
      - name: Ruff lint (production tree)
        run: uv run --frozen ruff check main.py core adapters interfaces database benchmark scripts \
          && echo "ruff check clean"
      - name: Ruff format check (production tree)
        run: uv run --frozen ruff format --check main.py core adapters interfaces database benchmark scripts \
          && echo "ruff format clean"
      - name: Mypy strict (advisory ratchet — legacy error baseline must shrink, never grow)
        continue-on-error: true
        run: uv run --frozen mypy
      - name: Unit / integration / simulation / stress tests
        run: uv run --frozen python -m unittest discover -s tests -t . -v
