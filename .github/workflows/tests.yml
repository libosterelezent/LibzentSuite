name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # the weekly health sweep reuses this whole gate

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Build (the pyproject inventory contract)
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: |
          uv build
          ls -1 dist/

  # The job name is load-bearing. master's ruleset requires the four Linux
  # contexts BY NAME ("unittest (3.10)" .. "unittest (3.13)"), so each leg
  # carries its name suffix LITERALLY in the matrix — no expression logic
  # between the matrix and the names a ruleset depends on.
  unittest:
    name: unittest (${{ matrix.python-version }}${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        # the full support floor: 3.10 (the declared minimum) through
        # the newest stable — a green 3.11 proved nothing about the rest
        include:
          - { os: ubuntu-latest, python-version: "3.10", label: "" }
          - { os: ubuntu-latest, python-version: "3.11", label: "" }
          - { os: ubuntu-latest, python-version: "3.12", label: "" }
          - { os: ubuntu-latest, python-version: "3.13", label: "" }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # every step below is bash. A Windows runner defaults to pwsh, where
    # $(...), && and [ ] all fail; `bash` there is the Git for Windows
    # shell the local gate was validated in.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install dependencies (exact lock; fails on pyproject/lock drift)
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: uv sync --locked
      - name: Ruff lint (production tree)
        run: |
          uv run --frozen ruff check main.py core adapters interfaces database benchmark scripts parsers plugins \
            && echo "ruff check clean"
      - name: Ruff format check (production tree)
        run: |
          uv run --frozen ruff format --check main.py core adapters interfaces database benchmark scripts parsers plugins \
            && echo "ruff format clean"
      - name: requirements.txt export sync (the AGENTS.md §8 contract)
        run: |
          uv export --locked --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Pyright ratchet (.github/pyright-baseline)
        run: |
          # parsed by the project's locked interpreter and fed on stdin: a
          # bare `python3` is whatever the runner has on PATH, which is not
          # necessarily that interpreter
          ERRORS=$(uv run --frozen pyright --outputjson \
            core adapters database interfaces plugins benchmark scripts parsers main.py \
            2>/dev/null | uv run --frozen python -c "import json, sys; print(json.load(sys.stdin)['summary']['errorCount'])")
          BASELINE=$(cat .github/pyright-baseline)
          echo "pyright errors: $ERRORS (baseline: $BASELINE)"
          if [ "$ERRORS" -gt "$BASELINE" ]; then
            echo "::error::The pyright error count grew ($BASELINE -> $ERRORS)."
            exit 1
          fi
          if [ "$ERRORS" -lt "$BASELINE" ]; then
            echo "::error::pyright improved but the baseline was not lowered — update .github/pyright-baseline to $ERRORS."
            exit 1
          fi
      - name: Unit / integration / simulation / stress tests (coverage)
        # one -q: pyproject's addopts already carry one, and a second hides
        # the "N passed" summary line from the log
        run: |
          uv run --frozen pytest tests/ -n auto --dist loadscope --cov=core --cov=adapters --cov=database --cov=interfaces --cov=plugins --cov=benchmark --cov=scripts --cov=parsers --cov-report=term-missing
          uv run --frozen coverage report
      - name: Coverage summary (job annotation)
        if: always()
        run: uv run --frozen coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
