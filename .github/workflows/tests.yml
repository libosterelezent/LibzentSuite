name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call: # the weekly health sweep reuses this whole gate

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.13.5
      - name: Install dependencies (exact lock; fails on pyproject/lock drift)
        env:
          UV_PYTHON_PREFERENCE: only-system
        run: uv sync --locked
      - name: Ruff lint (production tree)
        run: |
          uv run --frozen ruff check main.py core adapters interfaces database benchmark scripts parsers plugins \
            && echo "ruff check clean"
      - name: Ruff format check (production tree)
        run: |
          uv run --frozen ruff format --check main.py core adapters interfaces database benchmark scripts parsers plugins \
            && echo "ruff format clean"
      - name: requirements.txt export sync (the AGENTS.md §8 contract)
        run: |
          uv export --format requirements-txt --no-hashes --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Mypy strict ratchet (baseline must shrink, never grow)
        run: |
          uv run --frozen mypy &> /tmp/mypy.log || true
          errors=$(grep -c "error:" /tmp/mypy.log || true)
          baseline=$(<.github/mypy-baseline)
          echo "mypy errors: $errors (baseline: $baseline)"
          if [ "$errors" -gt "$baseline" ]; then
            echo "::error::The mypy error count grew ($baseline -> $errors). Fix the new strict errors; lower .github/mypy-baseline only after fixing existing ones."
            exit 1
          fi
          if [ "$errors" -lt "$baseline" ]; then
            echo "::notice::mypy improved ($baseline -> $errors) — lower .github/mypy-baseline in this PR to lock in the gain."
          fi
      - name: Unit / integration / simulation / stress tests
        run: uv run --frozen python -m unittest discover -s tests -t . -v
