[project]
# Application metadata + dependency declaration for uv (uv.lock is the
# pinned universal resolution; AGENTS.md §8/§9). Version is a placeholder —
# the framework does not yet publish releases.
name = "libzentsuite"
version = "0.0.0"
description = "Game-agnostic, multi-account Discord flow-orchestration framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "libosterelezent" },
]
keywords = [
    "discord",
    "automation",
    "orchestration",
    "multi-account",
    "selfbot",
    "rate-limiting",
    "asyncio",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# dependency tree = the DIRECT third-party imports of the production
# tree, audited 2026-11-17: aiosqlite (database/connection), cryptography
# (credential Fernet), discord (the better.py-self fork), fastapi +
# pydantic (interfaces/api — pydantic declared because app.py imports
# BaseModel directly, not just via fastapi). httpx had ZERO direct
# importers (a stale runtime entry) — removed.
dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=42",
    "discord.py-self @ git+https://github.com/Demonic1594/better.py-self.git",
    "fastapi>=0.162.5",
    "pydantic>=2.14",
]

[project.optional-dependencies]
# the interface surfaces, deliberately optional: the API server needs a
# ASGI runner (nothing serves build_app without it) and the Flet UI
# needs flet + its HTTP client. `pip install libzentsuite[all]` gets
# both; the core (CLI + REPL) needs neither.
api = [
    "uvicorn>=0.34",
]
ui = [
    "flet>=0.28",
    "httpx>=0.28.1",
]
all = [
    "libzentsuite[api,ui]",
]

[project.urls]
Homepage = "https://github.com/libosterelezent/LibzentSuite"
Repository = "https://github.com/libosterelezent/LibzentSuite"
Issues = "https://github.com/libosterelezent/LibzentSuite/issues"
Changelog = "https://github.com/libosterelezent/LibzentSuite/blob/master/CHANGELOG.md"

[build-system]
# The app normally runs from the checkout (`python main.py`, uv-managed
# env), but `pip install -e .` / `uv build` must also work. Explicit
# inventory: setuptools' flat-layout auto-discovery sees seven top-level
# folders and aborts ("multiple parent folders ... including unwanted
# folders"). tests/ are test-only; plugins/ are runtime-DISCOVERED from
# the plugins dir (never importable packages) — both stay out of the wheel.
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = [
    "core*",
    "adapters*",
    "database*",
    "interfaces*",
    "benchmark*",
    "parsers*",
    "scripts*",
]

[dependency-groups]
# Dev/CI tooling (AGENTS.md §8) — installed by `uv sync` alongside the
# runtime lock; NOT runtime dependencies.
dev = [
    "bandit>=1.9.4",
    "coverage>=7.16.2",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "psutil>=7.2.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=6.0.0",
    "pytest-rerunfailures>=15.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.4",
    "ruff==0.17.2",
]

[tool.ruff]
# Engineering standards: AGENTS.md §8 — Ruff owns linting, import sorting,
# and formatting for this repository (one canonical config; no competing
# Black/isort/pyflakes setups).
exclude = ["knowledgebase","docs"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# The AGENTS.md §8 baseline rule set. TCH is written TC here: upstream
# renamed the flake8-type-checking codes (TCH remains a deprecated alias
# in ruff 0.17.x; TC is the current canonical name).
select = [
    "E4",   # pycodestyle errors (imports, lines)
    "E7",   # pycodestyle (statements)
    "E9",   # pycodestyle (runtime)
    "F",    # pyflakes (supersedes the CI pyflakes step)
    "W",    # pycodestyle warnings
    "I",    # isort — import sorting
    "UP",   # pyupgrade — target Python 3.10+
    "B",    # flake8-bugbear — likely bugs
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie — misc constructs
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking — runtime-unneeded typing imports
]
ignore = [
    # House style: documentation strings and comments deliberately use
    # typographic punctuation and glyphs (em dashes, arrows, ×). These
    # three rules would rewrite intentional prose to plain ASCII.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


[tool.coverage.run]
# the production tree only — tests measure the shipped code, not
# themselves; main.py is the interactive entry point (never imported
# by the suite) so it stays out of the measured set
source = [
    "core",
    "adapters",
    "database",
    "interfaces",
    "plugins",
    "benchmark",
    "parsers",
    "scripts"
]
# operator-only tooling stays OUT of the product floor: the live-debugging
# harness (2,060 lines) is a supervised diagnostic tool with its own test
# file, not shipped surface — measuring it diluted the floor 76.8 -> 75.5
# without a product meaning (2026-11-17; the floor itself is unchanged)
omit = ["scripts/live-debugging/*"]
branch = true

[tool.coverage.report]
# floor set just under the first full measured level (77.0% branch
# coverage, 2026-11-15); raise it as coverage grows — never lower it
# without recording why
fail_under = 76.0
precision = 1
show_missing = false
skip_covered = true

[tool.pytest.ini_options]
# pytest owns the test runner (adopted 2026-11-19; unittest discover retired).
# xdist parallelizes across workers — the suite is embarrassingly parallel
# (per-test temp DBs, fakes, per-process singleton isolation).
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --ignore=dump"
# Per-test hang ceiling (pytest-timeout, thread method — SIGALRM is not
# portable to Windows). A hanging test fails by name with every thread's
# stack dumped, instead of a leg dying at its LEG_TIMEOUT_S ceiling with
# no attribution. 120 s is 4x the slowest legitimate test (~30 s, the
# rich-model 202-retry shape).
timeout = 120
timeout_method = "thread"

# The distribution strategy lives in the RUNNER (preflight.sh, CI), not
# here: the full suite runs parallel (-n auto --dist loadscope) — the
# serial-unittest fallback for test_rich_model.py was retired with the
# click-cancellation isolation fix (2026-11-19); keeping addopts bare
# means `pytest tests/unit/test_x.py` Just Works for iteration without
# pulling in xdist.

[tool.pyright]
# pyright owns static typing (adopted 2026-11-19; mypy shelved to the
# lock with honor — both trees reached ZERO under its ratchets).
# The baseline ratchet lives at .github/pyright-baseline (81 minus
# the 5 flet missing-imports = 76): grow fails, shrink locks in.
include = ["core", "adapters", "database", "interfaces", "plugins", "benchmark", "scripts", "parsers", "main.py"]
exclude = ["dump", "**/__pycache__", ".venv"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
# flet is the optional [ui] extra — absent from the dev environment,
# same per-module exception mypy had
reportMissingImports = false
