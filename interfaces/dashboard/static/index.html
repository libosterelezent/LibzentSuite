<!DOCTYPE html>
<!-- LibzentSuite dashboard v3 — the Carbon rebuild.
     Page shell only: styling lives in styles/, behaviour in js/ (no build
     step — plain files served by interfaces/dashboard/server.py).
     IA: Home · Accounts · Activity · Fleet · Policies · Admin · Tools (+ plugin pages)
     Hash-routed; chrome built by js/shell.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LibzentSuite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230a0a0a'/%3E%3Crect x='1' y='1' width='30' height='30' rx='3' fill='none' stroke='%233a3a3a' stroke-width='1.5'/%3E%3Cpath d='M9 23V9h7a5 5 0 0 1 0 10h-4' fill='none' stroke='%23a0a0a0' stroke-width='3' stroke-linecap='square'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" id="lz-fonts">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/shell.css">
</head>
<body>

<div id="app">
  <!-- Sidebar: rail (desktop) / drawer (mobile); built by shell.js -->
  <aside id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <span class="name">LibzentSuite</span>
      <button id="side-toggle" type="button" title="Collapse sidebar" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button id="side-close" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <nav id="snav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div id="side-backdrop" aria-hidden="true"></div>

  <!-- Main -->
  <div id="main">
    <header id="topbar">
      <button id="menu-btn" class="topbar-btn" type="button" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <span class="crumb dim" id="page-crumb">Workspace</span>
      <span class="crumb-separator" aria-hidden="true">/</span>
      <span class="page-title" id="page-title">Overview</span>
      <div class="spacer"></div>
      <div id="search-wrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search" placeholder="Search workspace…" autocomplete="off" aria-label="Search accounts, groups, plugin pages">
        <kbd class="search-kbd" aria-hidden="true">Ctrl K</kbd>
        <div id="search-results" role="listbox"></div>
      </div>
      <div id="conn" class="conn" title="WebSocket"><div id="conn-dot" class="conn-dot"></div><span id="conn-msg" class="dim">connecting…</span></div>
      <button id="help-btn" class="topbar-btn" type="button" title="Help and diagnostics" aria-label="Open help and diagnostics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 0 1 4.9.6c0 1.8-2.5 2.1-2.5 3.8M12 17h.01"/></svg></button>
      <button id="notifications-btn" class="topbar-btn" type="button" title="Recent activity" aria-label="Open recent activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
      <button id="theme-btn" class="topbar-btn" type="button" title="Theme engine" aria-label="Open theme engine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg></button>
    </header>

    <main id="view" class="view" aria-live="polite"></main>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/router.js"></script>
<script src="js/render.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/accounts.js"></script>
<script src="js/views/activity.js"></script>
<script src="js/views/groups.js"></script>
<script src="js/views/policies.js"></script>
<script src="js/views/admin.js"></script>
<script src="js/views/tools.js"></script>
<script src="js/views/plugins.js"></script>
<script src="js/shell.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
